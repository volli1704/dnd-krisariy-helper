<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="3"/>
  <!-- D20 Outline -->
  <polygon points="50,15 85,35 85,65 50,85 15,65 15,35" stroke="url(#goldGrad)" stroke-width="3" fill="#1e1b4b" fill-opacity="0.8"/>
  <polygon points="50,15 50,85" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2,2"/>
  <polygon points="15,35 85,65" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2,2"/>
  <polygon points="15,65 85,35" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2,2"/>
  <!-- Center Triangle -->
  <polygon points="50,30 75,70 25,70" stroke="url(#goldGrad)" stroke-width="3" fill="#312e81"/>
  <text x="50" y="60" fill="#fcd34d" font-family="'Cinzel', serif, sans-serif" font-weight="900" font-size="22" text-anchor="middle" dominant-baseline="middle">20</text>
</svg>